<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conheça experiências e relatos de estudantes na comunidade Tô Dentro.">
    <title>Comunidade | Tô Dentro</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/pages/comunidade.css">
    <script defer src="../scripts/services/auth.js"></script>
</head>

<body>
    <main id="conteudo-principal" class="page-container community-page">
        <header class="community-header">
            <a class="community-back" id="community-back" href="../../index.html" aria-label="Voltar">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_back_ios_new</span>
            </a>
            <span>Comunidade</span>
        </header>
        <h1 id="community-title">Quem vive, compartilha.</h1>
        <p class="community-intro">Experiências reais ajudam novas escolhas.</p>
        <p class="community-context" id="community-context" hidden></p>

        <div class="community-categories" role="group" aria-label="Categorias da comunidade">
            <button class="community-category category-blue" type="button" data-category="experiencias"
                aria-pressed="true">Experiências</button>
            <button class="community-category category-blue" type="button" data-category="duvidas"
                aria-pressed="false">Dúvidas</button>
        </div>

        <form id="community-search" role="search" aria-label="Buscar na comunidade">
            <label class="community-search-label" for="community-query">Buscar</label>
            <div class="search-field"><input id="community-query" name="busca" type="search"
                    placeholder="Universidade, curso ou assunto" autocomplete="off"></div>
        </form>

        <button class="button community-share" id="community-share" type="button">Compartilhar minha
            experiência</button>

        <div class="question-filters" id="question-filters" role="group" aria-label="Filtros de dúvidas" hidden>
            <button class="question-filter" id="questions-all" type="button" aria-pressed="true">Todas</button>

            <label class="select-chevron"><span class="visually-hidden">Universidade</span><select
                    id="questions-university">
                    <option value="">Universidade</option>
                </select>
            </label>

            <button class="question-filter" id="questions-admission" type="button"
                aria-pressed="false">Ingresso</button>
            <label class="select-chevron">
                <span class="visually-hidden">Tema</span>
                <select id="questions-topic">
                    <option value="">Tema</option>
                    <option value="pesquisa">Pesquisa</option>
                    <option value="permanencia">Permanência</option>
                    <option value="vida-academica">Vida acadêmica</option>
                </select>
            </label>
        </div>

        <label class="community-sort" for="community-sort">Ordenar por:
            <select id="community-sort">
                <option value="recentes">Mais recentes</option>
                <option value="antigos">Mais antigos</option>
            </select>
        </label>
        
        <section id="community-feed" class="community-feed" aria-label="Relatos da comunidade"></section>
        <p id="community-empty" class="community-empty" role="status" hidden></p>

        <aside class="community-notice" aria-labelledby="community-notice-title">
            <h2 id="community-notice-title">Conteúdo da comunidade</h2>
            <p id="community-notice-text">Relatos são pessoais e não são conteúdos oficiais. Consulte fontes oficiais
                para editais e regras.</p>
        </aside>
        <noscript>Ative o JavaScript para carregar os relatos demonstrativos.</noscript>
    </main>

    <td-bottom-nav></td-bottom-nav>
    <script defer src="../data/universities.js"></script>
    <script defer src="../data/community.js"></script>
    <script defer src="../scripts/components/bottom-nav.js"></script>
    <script defer src="../scripts/pages/comunidade.js"></script>
    <script defer src="../scripts/components/map-links.js"></script>
    <script defer src="../scripts/components/external-links.js"></script>
</body>

</html>
