<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtros e preferências | Tô Dentro</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/pages/filtros.css">
    <script defer src="../scripts/services/auth.js"></script>
</head>

<body>
    <main class="page-container preferences-page" id="conteudo-principal">
        <header class="preferences-header">
            <a id="filters-back" class="preferences-back" href="./buscar-universidades.html"
                aria-label="Voltar à busca">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_back_ios_new</span>
            </a>
            <span>Filtros e preferências</span>
        </header>

        <h1>A busca do seu jeito.</h1>
        <p class="preferences-intro">Combine o que é importante para você.</p>

        <form id="preferences-form" action="./buscar-universidades.html" method="get">
            <fieldset class="preference-card">
                <legend>Cidade</legend>
                <div class="preference-options">
                    <label class="preference-option"><input type="checkbox" name="city" value="sao-paulo"
                            checked><span>São Paulo</span></label>
                    <label class="preference-option"><input type="checkbox" name="city"
                            value="campinas"><span>Campinas</span></label>
                </div>
            </fieldset>

            <fieldset class="preference-card">
                <legend>Tipo de instituição</legend>
                <div class="preference-options">
                    <label class="preference-option">
                        <input type="checkbox" name="type" value="publica" checked><span>Pública</span>
                    </label>
                    <label class="preference-option">
                        <input type="checkbox" name="type" value="particular"><span>Particular</span>
                    </label>
                </div>
            </fieldset>

            <fieldset class="preference-card">
                <legend>Modalidade</legend>
                <div class="preference-options">
                    <label class="preference-option">
                        <input type="checkbox" name="mode" value="presencial"><span>Presencial</span>
                    </label>
                    <label class="preference-option">
                        <input type="checkbox" name="mode" value="ead"><span>EAD</span>
                    </label>
                    <label class="preference-option">
                        <input type="checkbox" name="mode" value="hibrida"><span>Híbrida</span>
                    </label>
                </div>
            </fieldset>

            <fieldset class="preference-card">
                <legend>Formas de ingresso</legend>
                <div class="preference-options">
                    <label class="preference-option">
                        <input type="checkbox" name="admission" value="sisu"><span>Sisu</span>
                    </label>
                    <label class="preference-option">
                        <input type="checkbox" name="admission" value="enem"><span>Enem</span>
                    </label>
                    <label class="preference-option">
                        <input type="checkbox" name="admission" value="prouni"><span>ProUni</span>
                    </label>
                    <label class="preference-option">
                        <input type="checkbox" name="admission" value="vestibular">
                        <span>Vestibular próprio</span>
                    </label>
                </div>
            </fieldset>
            
            <fieldset class="preference-card">
                <legend>Curso</legend>
                <div class="course-selects">
                    <label class="course-select" for="course-choice">Curso
                        <select id="course-choice" name="course" aria-describedby="course-help">
                            <option value="">Todos os cursos</option>
                        </select>
                    </label>
                    <label class="course-select" for="course-area">Área
                        <select id="course-area" name="area">
                            <option value="">Todas as áreas</option>
                        </select>
                    </label>
                </div>
                <p class="course-help" id="course-help">Escolha uma área para ver os cursos correspondentes.</p>
            </fieldset>
            <input type="hidden" name="busca" id="preserved-query">
            <input type="hidden" name="sort" id="preserved-sort">
            <div class="preferences-actions">
                <button class="button button-ink" type="submit">Aplicar filtros</button>
                <button class="button button-yellow" id="clear-filters" type="button">Limpar filtros</button>
            </div>
        </form>
    </main>
    <script defer src="../data/courses.js"></script>
    <script defer src="../scripts/pages/filtros.js"></script>
    <script defer src="../scripts/components/map-links.js"></script>
    <script defer src="../scripts/components/external-links.js"></script>
</body>

</html>
