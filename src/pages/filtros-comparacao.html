<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtros da comparação | Tô Dentro</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/pages/filtros-comparacao.css">
  <script defer src="../scripts/services/auth.js"></script>
  <script defer src="../scripts/services/navigation.js"></script>
</head>

<body>
  <main class="page-container comparison-page" id="conteudo-principal">
    <header><a id="comparison-back" href="./buscar-nota-de-corte.html" aria-label="Voltar"><span
          class="material-symbols-outlined" aria-hidden="true">chevron_left</span></a><span>Filtros da comparação</span>
    </header>
    <h1>Monte sua comparação.</h1>
    <p class="comparison-subtitle">Escolha as opções em um só lugar.</p>

    <section class="comparison-intro">
      <div><span class="comparison-icon blue" aria-hidden="true">⇄</span>
        <h2>Uma comparação do seu jeito</h2>
      </div>
      <p>Escolha um curso e salve pelo menos duas opções. Cada uma mantém seus próprios critérios.</p>
    </section>

    <label for="comparison-course">Curso da comparação</label>
    <span class="select-chevron"><select id="comparison-course" name="curso" required></select></span>
    <form id="comparison-form">
      <fieldset>
        <legend>Adicionar uma opção</legend>
        <div class="comparison-grid">
          <div>
            <label for="comparison-university">Universidade</label>
            <span class="select-chevron">
              <select id="comparison-university" name="universidade" required></select>
            </span>
          </div>

          <div>
            <label for="comparison-campus">Campus</label>
            <span class="select-chevron">
              <select id="comparison-campus" name="campus" required></select>
            </span>
          </div>
          <div>
            <label for="comparison-shift">Turno</label>
            <span class="select-chevron">
              <select id="comparison-shift" name="turno" required></select>
            </span>
          </div>
          <div>
            <label for="comparison-process">Processo seletivo</label>
            <span class="select-chevron">
              <select id="comparison-process" name="processo" required></select>
            </span>
          </div>
          <div>
            <label for="comparison-year">Edição</label>
            <span class="select-chevron">
              <select id="comparison-year" name="edicao" required></select>
            </span>
          </div>
          <div>
            <label for="comparison-category">Modalidade de concorrência</label>
            <span class="select-chevron">
              <select id="comparison-category" name="modalidade" required></select>
            </span>
          </div>
          <div>
            <label for="comparison-stage">Fase</label>
            <span class="select-chevron">
              <select id="comparison-stage" name="fase"></select>
            </span>
          </div>
        </div>
      </fieldset>

      <div class="comparison-builder-actions">
        <button id="comparison-add" class="button button-ink" type="submit">Salvar opção na comparação</button>
        <button id="comparison-clear-fields" class="comparison-clear" type="button">Limpar campos</button>
      </div>
      <p id="comparison-builder-status" class="comparison-validation" role="status"></p>
    </form>

    <section class="comparison-institutions" aria-labelledby="institutions-title">
      <h2 id="institutions-title">Suas opções selecionadas</h2>
      <p id="comparison-count" class="comparison-count" role="status"></p>
      <div id="comparison-selected" class="comparison-selected"></div>
    </section>

    <p id="comparison-validation" class="comparison-validation" role="status"></p>
    <button id="comparison-submit" class="comparison-submit" type="button" disabled>
      <span aria-hidden="true">⇄</span>
      <span id="comparison-submit-label">Comparar opções</span>
    </button>
    <button id="comparison-clear-all" class="comparison-clear" type="button">Limpar comparação</button>

  </main>
  <td-bottom-nav active="buscar"></td-bottom-nav>
  
  <script defer src="../data/mock-data.js"></script>
  <script defer src="../data/catalog.js"></script>
  <script defer src="../data/universities.js"></script>
  <script defer src="../data/courses.js"></script>
  <script defer src="../data/comparisons.js"></script>
  <script defer src="../scripts/components/bottom-nav.js"></script>
  <script defer src="../scripts/components/academic-details.js"></script>
  <script defer src="../scripts/components/comparison-details.js"></script>
  <script defer src="../scripts/pages/filtros-comparacao.js"></script>
</body>

</html>
